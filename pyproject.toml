[project]
name = "kvitto-payments"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — сортировка импортов, UP — современный синтаксис,
# B — типичные баги
select = ["E", "W", "F", "I", "UP", "B"]
